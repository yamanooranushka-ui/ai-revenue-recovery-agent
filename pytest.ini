[pytest]
# Put the project root on sys.path so tests can do `from src... import ...`.
pythonpath = .
# Default test folder: only the Phase 1 suite runs with `python -m pytest`.
# (The legacy root-level test_phase1.py / test_phase2.py can still be run
#  explicitly, e.g. `python -m pytest test_phase1.py test_phase2.py`.)
testpaths = tests
# "live" marks optional tests that make real API calls. They are
# skipped automatically unless a GEMINI_API_KEY is present.
markers =
    live: optional live API tests (require GEMINI_API_KEY; skipped otherwise)
